name: TWRP munch Compiler

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'Device Tree Repository URL'
        required: true
        default: 'https://github.com/olzhas0986/twrp_device_xiaomi_munch'
        type: string
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'new'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    container:
      image: ubuntu:20.04
      options: --privileged

    defaults:
      run:
        shell: bash

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VENDOR: xiaomi
      DEVICE: munch
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        apt-get update && apt-get install -y sudo
        sudo apt-get remove -y '^ghc-.*' '^dotnet-.*' '^llvm-.*' 'php.*' 'node.*' 'gfortran.*' || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

    - name: Install Base Utilities & Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 sudo bash ca-certificates rsync

        mkdir -p /usr/local/bin
        curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
        chmod a+rx /usr/local/bin/repo

    - name: Run Build Script
      run: |
        set -e

        # Git identity for repo init
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git config --global color.ui false

        # Exports
        export VENDOR=xiaomi
        export DEVICE=munch

        # Twrp folder
        mkdir -p twrp && cd twrp

        # Repo init TWRP
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

        # Sync repos
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

        # Clone device repos
        git clone "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" device/${VENDOR}/${DEVICE}

        rm -rf bootable/recovery
        git clone https://github.com/olzhas0986/android_bootable_recovery.git bootable/recovery

        # Build TWRP
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch twrp_${DEVICE}-eng
        set -e
        mka adbd bootimage -j$(nproc --all)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-${{ env.DEVICE }}-boot
        path: twrp/out/target/product/${{ env.DEVICE }}/boot.img
        if-no-files-found: warn

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          twrp/out/target/product/${{ env.DEVICE }}/boot.img
        name: TWRP Recovery for ${{ env.DEVICE }} // ${{ env.BUILD_DATE }}
        tag_name: twrp-${{ env.DEVICE }}-${{ github.run_id }}
        body: |
          ## TWRP Build - Unofficial
          - **Device:** `${{ env.DEVICE }}` (`${{ env.VENDOR }}`)
          - **Branch:** `twrp-12.1`
          - **Device Tree:** ${{ env.DEVICE_TREE }} (`${{ env.DEVICE_TREE_BRANCH }}`)
          - **Build Date:** ${{ env.BUILD_DATE }}
          
